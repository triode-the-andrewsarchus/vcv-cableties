<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90" height="380" viewBox="0 0 90 380">
  <defs>
    <!-- Brushed Anodized Aluminum NIM-BIN Base -->
    <linearGradient id="nimAluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9ccc6" />
      <stop offset="15%" stop-color="#d8dbd5" />
      <stop offset="50%" stop-color="#d0d3cd" />
      <stop offset="85%" stop-color="#dadbd5" />
      <stop offset="100%" stop-color="#c2c5bf" />
    </linearGradient>

    <!-- Subtle Vertical Brushed Sheen -->
    <linearGradient id="nimSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Main Brushed Aluminum Faceplate -->
  <rect width="90" height="380" fill="url(#nimAluminum)" />
  <rect width="90" height="380" fill="url(#nimSheen)" />

  <!-- Machined Edge Chamfers -->
  <line x1="0.5" y1="0" x2="0.5" y2="380" stroke="#eff1ed" stroke-width="1" />
  <line x1="89.5" y1="0" x2="89.5" y2="380" stroke="#8c908a" stroke-width="1" />
  <line x1="0" y1="0.5" x2="90" y2="0.5" stroke="#eff1ed" stroke-width="1" />
  <line x1="0" y1="379.5" x2="90" y2="379.5" stroke="#7a7e78" stroke-width="1" />

  <!-- NIM-BIN Outer Technical Frame -->
  <rect x="4.5" y="16.5" width="81" height="347" rx="1.5" fill="none" stroke="#2b3035" stroke-width="1.0" />

  <!-- Top Accent Rule under NIM Header -->
  <line x1="4.5" y1="44.0" x2="85.5" y2="44.0" stroke="#b83a1b" stroke-width="1.6" />

  <!-- Alignment Corner Ticks for Scotch Tape Label Area -->
  <path d="M 11 61 L 11 58 L 14 58" fill="none" stroke="#55595c" stroke-width="0.8" />
  <path d="M 79 61 L 79 58 L 76 58" fill="none" stroke="#55595c" stroke-width="0.8" />
  <path d="M 11 89 L 11 92 L 14 92" fill="none" stroke="#55595c" stroke-width="0.8" />
  <path d="M 79 89 L 79 92 L 76 92" fill="none" stroke="#55595c" stroke-width="0.8" />

  <!-- Section Divider 1 -->
  <line x1="8" y1="98" x2="82" y2="98" stroke="#2b3035" stroke-width="0.8" />

  <!-- Section Divider 2 -->
  <line x1="8" y1="160" x2="82" y2="160" stroke="#2b3035" stroke-width="0.8" />

  <!-- Calibration Scale Marks around Spacing Knob at (45, 250) -->
  <g stroke="#1e2226" stroke-width="1.1">
    <!-- Center top tick -->
    <line x1="45" y1="225" x2="45" y2="229" />
    <!-- Left ticks -->
    <line x1="27.3" y1="232.3" x2="30.1" y2="235.1" />
    <line x1="20.0" y1="250.0" x2="24.0" y2="250.0" />
    <line x1="25.5" y1="266.0" x2="28.8" y2="263.3" stroke-width="1.4" />
    <!-- Right ticks -->
    <line x1="62.7" y1="232.3" x2="59.9" y2="235.1" />
    <line x1="70.0" y1="250.0" x2="66.0" y2="250.0" />
    <line x1="64.5" y1="266.0" x2="61.2" y2="263.3" stroke-width="1.4" />
  </g>

  <!-- Section Divider 3 -->
  <line x1="8" y1="280" x2="82" y2="280" stroke="#2b3035" stroke-width="0.8" />

  <!-- Bottom Accent Rule above NIM Footer -->
  <line x1="4.5" y1="352.0" x2="85.5" y2="352.0" stroke="#2b3035" stroke-width="0.8" />
</svg>
