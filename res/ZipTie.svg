<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90" height="380" viewBox="0 0 90 380">
  <defs>
    <!-- Brushed Anodized Aluminum NIM-BIN Base -->
    <linearGradient id="nimAluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9ccc6" />
      <stop offset="15%" stop-color="#d8dbd5" />
      <stop offset="50%" stop-color="#d0d3cd" />
      <stop offset="85%" stop-color="#dadbD5" />
      <stop offset="100%" stop-color="#c2c5bf" />
    </linearGradient>

    <!-- Subtle Vertical Brushed Sheen -->
    <linearGradient id="nimSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>

    <!-- NIM Header Block -->
    <linearGradient id="nimHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2429" />
      <stop offset="100%" stop-color="#14181c" />
    </linearGradient>

    <!-- Hazard Stripes Pattern for Molly-Guard Bay -->
    <pattern id="hazardStripes" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="8" fill="#d99b16" />
      <rect x="4" y="0" width="4" height="8" fill="#1b1d1f" />
    </pattern>
  </defs>

  <!-- Main Brushed Aluminum Faceplate -->
  <rect width="90" height="380" fill="url(#nimAluminum)" />
  <rect width="90" height="380" fill="url(#nimSheen)" />

  <!-- Fine Horizontal Brushed Grain Lines (subtle) -->
  <g stroke="#000000" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="30" x2="90" y2="30" />
    <line x1="0" y1="75" x2="90" y2="75" />
    <line x1="0" y1="120" x2="90" y2="120" />
    <line x1="0" y1="165" x2="90" y2="165" />
    <line x1="0" y1="210" x2="90" y2="210" />
    <line x1="0" y1="255" x2="90" y2="255" />
    <line x1="0" y1="300" x2="90" y2="300" />
    <line x1="0" y1="345" x2="90" y2="345" />
  </g>

  <!-- Machined Edge Chamfers -->
  <line x1="0.5" y1="0" x2="0.5" y2="380" stroke="#eff1ed" stroke-width="1" />
  <line x1="89.5" y1="0" x2="89.5" y2="380" stroke="#8c908a" stroke-width="1" />
  <line x1="0" y1="0.5" x2="90" y2="0.5" stroke="#eff1ed" stroke-width="1" />
  <line x1="0" y1="379.5" x2="90" y2="379.5" stroke="#7a7e78" stroke-width="1" />

  <!-- NIM-BIN Outer Technical Frame -->
  <rect x="4.5" y="16.5" width="81" height="347" rx="1.5" fill="none" stroke="#222629" stroke-width="1.0" />

  <!-- NIM Top Identification Block -->
  <rect x="4.5" y="16.5" width="81" height="29" fill="url(#nimHeader)" />
  <line x1="4.5" y1="45.5" x2="85.5" y2="45.5" stroke="#b83a1b" stroke-width="1.8" />

  <!-- Header Typography -->
  <text x="45" y="30" font-family="sans-serif" font-weight="900" font-size="11" fill="#f4f5f0" text-anchor="middle" letter-spacing="1.8">ZIP-TIE</text>
  <text x="45" y="40.5" font-family="monospace" font-weight="700" font-size="6.2" fill="#e07a5f" text-anchor="middle" letter-spacing="1.2">NIM-406 HARNESS</text>

  <!-- SECTION 1: KEYBOARD SHORTCUT TAPE AREA (y=48..96) -->
  <text x="45" y="55" font-family="sans-serif" font-weight="700" font-size="5.5" fill="#2c3033" text-anchor="middle" letter-spacing="1.2">KEY COMBO</text>
  <!-- Alignment Corner Ticks for Label Area -->
  <path d="M 11 60 L 11 57 L 14 57" fill="none" stroke="#55595c" stroke-width="0.8" />
  <path d="M 79 60 L 79 57 L 76 57" fill="none" stroke="#55595c" stroke-width="0.8" />
  <path d="M 11 89 L 11 92 L 14 92" fill="none" stroke="#55595c" stroke-width="0.8" />
  <path d="M 79 89 L 79 92 L 76 92" fill="none" stroke="#55595c" stroke-width="0.8" />

  <line x1="8" y1="98" x2="82" y2="98" stroke="#222629" stroke-width="0.8" />

  <!-- SECTION 2: RECTANGULAR TIE APPLICATOR BUTTON (y=100..162) -->
  <text x="45" y="109" font-family="sans-serif" font-weight="800" font-size="6.2" fill="#1e2226" text-anchor="middle" letter-spacing="1.0">APPLICATOR</text>
  <text x="45" y="116.5" font-family="monospace" font-weight="700" font-size="5.0" fill="#b83a1b" text-anchor="middle" letter-spacing="0.8">MANUAL ARM</text>

  <line x1="8" y1="162" x2="82" y2="162" stroke="#222629" stroke-width="0.8" />

  <!-- SECTION 3: WIRE PREVIEW + SPACING POTENTIOMETER (y=164..280) -->
  <text x="45" y="173" font-family="sans-serif" font-weight="800" font-size="6.2" fill="#1e2226" text-anchor="middle" letter-spacing="1.0">HARNESS PITCH</text>

  <!-- Calibration Scale Marks around Spacing Knob at (45, 250) -->
  <g stroke="#1e2226" stroke-width="1.0">
    <!-- Center top tick -->
    <line x1="45" y1="225" x2="45" y2="229" />
    <!-- Left ticks -->
    <line x1="27.3" y1="232.3" x2="30.1" y2="235.1" />
    <line x1="20.0" y1="250.0" x2="24.0" y2="250.0" />
    <line x1="25.5" y1="266.0" x2="28.8" y2="263.3" stroke-width="1.3" />
    <!-- Right ticks -->
    <line x1="62.7" y1="232.3" x2="59.9" y2="235.1" />
    <line x1="70.0" y1="250.0" x2="66.0" y2="250.0" />
    <line x1="64.5" y1="266.0" x2="61.2" y2="263.3" stroke-width="1.3" />
  </g>
  <!-- Scale Labels -->
  <text x="19" y="273" font-family="monospace" font-weight="700" font-size="5.5" fill="#1e2226" text-anchor="middle">MIN</text>
  <text x="71" y="273" font-family="monospace" font-weight="700" font-size="5.5" fill="#b83a1b" text-anchor="middle">MAX</text>

  <line x1="8" y1="281" x2="82" y2="281" stroke="#222629" stroke-width="0.8" />

  <!-- SECTION 4: DANGER SNIP ALL WITH MOLLY GUARD (y=282..354) -->
  <text x="45" y="291" font-family="sans-serif" font-weight="900" font-size="6.2" fill="#b82014" text-anchor="middle" letter-spacing="1.0">JETTISON ALL</text>

  <!-- Hazard Striped Warning Border around Molly-Guard Switch -->
  <rect x="16" y="296" width="58" height="46" rx="2.5" fill="url(#hazardStripes)" stroke="#1b1d1f" stroke-width="1.0" />
  <rect x="20" y="300" width="50" height="38" rx="1.5" fill="#222629" stroke="#111315" stroke-width="0.8" />

  <text x="45" y="350" font-family="monospace" font-weight="700" font-size="4.8" fill="#2c3033" text-anchor="middle" letter-spacing="0.6">LIFT GUARD · 2X CLICK</text>

  <!-- Bottom NIM Spec Footer -->
  <rect x="4.5" y="353.5" width="81" height="10" fill="#1e2429" />
  <text x="45" y="360.5" font-family="monospace" font-weight="700" font-size="5.2" fill="#c9ccc6" text-anchor="middle" letter-spacing="1.4">NIM-BIN · STD</text>
</svg>
