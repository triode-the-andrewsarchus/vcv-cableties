<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="90" height="380" viewBox="0 0 90 380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2024" />
      <stop offset="50%" stop-color="#16181b" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>

    <!-- Display Screen Gradient -->
    <linearGradient id="displayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Panel Base -->
  <rect width="90" height="380" fill="url(#panelBg)" />

  <!-- Subtle side bezel lines -->
  <line x1="0.5" y1="0" x2="0.5" y2="380" stroke="#2d3139" stroke-width="1" />
  <line x1="89.5" y1="0" x2="89.5" y2="380" stroke="#2d3139" stroke-width="1" />

  <!-- Accent top bar -->
  <rect x="0" y="0" width="90" height="3" fill="url(#accentCyan)" />

  <!-- Header Area -->
  <text x="45" y="27" font-family="sans-serif" font-weight="900" font-size="11" fill="#f1f5f9" text-anchor="middle" letter-spacing="1.5">ZIP TIES</text>
  <text x="45" y="38" font-family="sans-serif" font-weight="600" font-size="6.5" fill="#38bdf8" text-anchor="middle" letter-spacing="2.0">HARNESS</text>

  <!-- Divider line -->
  <line x1="12" y1="46" x2="78" y2="46" stroke="#262a33" stroke-width="1" />

  <!-- Digital Status Screen Border / Recess -->
  <rect x="9" y="54" width="72" height="68" rx="4" fill="url(#displayBg)" stroke="#262d3d" stroke-width="1.2" />

  <!-- Section: ARM TOOL -->
  <text x="45" y="146" font-family="sans-serif" font-weight="700" font-size="7" fill="#94a3b8" text-anchor="middle" letter-spacing="1.0">ARM TOOL</text>

  <!-- Section: SPACING -->
  <text x="45" y="216" font-family="sans-serif" font-weight="700" font-size="7" fill="#94a3b8" text-anchor="middle" letter-spacing="1.0">SPACING</text>

  <!-- Section: SNIP ALL -->
  <text x="45" y="292" font-family="sans-serif" font-weight="700" font-size="7" fill="#f87171" text-anchor="middle" letter-spacing="1.0">SNIP ALL</text>

  <!-- Bottom Accent / Brand -->
  <line x1="12" y1="354" x2="78" y2="354" stroke="#262a33" stroke-width="1" />
  <text x="45" y="365" font-family="sans-serif" font-weight="600" font-size="6" fill="#64748b" text-anchor="middle" letter-spacing="1.5">WIRE MGMT</text>
  <rect x="0" y="377" width="90" height="3" fill="url(#accentCyan)" />
</svg>
